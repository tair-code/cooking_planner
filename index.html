<title>Кулинарный планер</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, calm
   IDEA a paper planner page on a sage tablet: tabbed edge, grid paper, handwritten entries
   PICTURE the week board itself: day cards with breakfast/lunch/dinner lines and recipe stickers
   COLOUR sage frame, off-white grid paper, ink green-grey; mustard/sage/lavender meal tags
   TYPE Caveat for headings and entries + Nunito for UI
   LAYOUT laptop: board left, recipes+basket rail right; phone: tabs, board in 2 cols, rail below */
:root,:root[data-theme]{color-scheme:light;--frame:#dde7d3;--frame2:#cbd9bf;--paper:#f7f5ef;--grid:rgba(130,150,120,.11);--ink:#4f5a4c;--mut:#87917f;--line:#d9e0d1;--card:#fcfbf7;--acc:#8fab83;--b:#e6c67e;--l:#a9c49b;--d:#c3b2d8;--warn:#c98a6b}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%}
[hidden]{display:none!important}
body{background:var(--frame);color:var(--ink);font:15px/1.45 Nunito,system-ui,sans-serif;overflow-x:clip;padding:calc(14px + env(safe-area-inset-top,0px)) max(2vw,10px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(2vw,10px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:16px;min-height:38px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.tabs{display:flex;align-items:center;gap:4px;background:var(--frame2);border-radius:22px 22px 0 0;padding:8px 14px 6px;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:800;margin-right:6px}
.tab{border:0;background:none;text-decoration:underline;text-underline-offset:4px;color:var(--mut);padding:4px 10px;min-height:34px;border-radius:12px}
.tab[aria-selected=true]{color:var(--ink);background:var(--paper);text-decoration:none;font-weight:700}
.date{display:flex;align-items:center;gap:10px;padding-bottom:6px}
.date b{font:700 46px/1 Caveat,cursive;letter-spacing:-.01em}
.date span{background:var(--paper);border-radius:14px;padding:2px 16px;font:700 34px/1.1 Caveat,cursive;color:var(--acc)}
.wk{display:flex;gap:6px;justify-content:flex-end;padding-bottom:8px}
.wk button{min-height:30px;padding:2px 10px;font-size:12px;background:var(--paper);border-color:transparent;color:var(--mut)}
.wk button.on{border-color:var(--acc);color:var(--ink);font-weight:700}
.paper{max-width:1320px;margin:0 auto;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border-radius:0 26px 26px 26px;padding:clamp(14px,2.4vw,28px);box-shadow:0 1px 0 var(--frame2)}
h1,h2{font-family:Caveat,cursive;font-weight:700;margin:0;line-height:1.05}
h1{font-size:40px}h2{font-size:28px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;background:none}
.seg button.on{background:var(--acc);color:#fff}
.sv{font-size:13px;color:var(--mut)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
@media(max-width:1200px){.layout{grid-template-columns:minmax(0,1fr)}.rail{position:static;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}}
.dscroll{overflow-x:auto;padding-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
@media(max-width:560px){.days{grid-template-columns:repeat(7,minmax(84px,1fr))}}
.day{padding:6px 5px 8px!important;border-radius:12px!important}
.day{background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--line);border-radius:16px;padding:8px 10px 10px}
.day.out{opacity:.5}
.day.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.dh{display:flex;justify-content:space-between;align-items:baseline;font:700 19px/1.1 Caveat,cursive}
.dh small{font:600 12px Nunito,sans-serif;color:var(--mut)}
.ml{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;margin-top:6px}
.ml i{width:8px;height:8px;border-radius:50%;display:inline-block}
.layout:not(.editing) .slot{border-bottom-style:solid}
.slot{min-height:22px;border-bottom:1.5px dashed var(--line);display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:3px 0}
.slot.over{background:color-mix(in srgb,var(--acc) 18%,transparent);border-radius:8px}
.chip{font:600 16px/1.1 Caveat,cursive;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--l);border-radius:8px;padding:1px 3px 1px 5px;cursor:grab;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow-wrap:anywhere}
.chip[data-m=b]{border-left-color:var(--b)}.chip[data-m=d]{border-left-color:var(--d)}
.chip .x{border:0;background:none;min-height:0;padding:0 2px;color:var(--mut);font:14px Nunito}
.add{min-height:24px;padding:0 6px;font-size:14px;color:var(--mut);border-style:dashed;background:none}
.rail{display:grid;gap:16px;position:sticky;top:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.rlist{display:flex;flex-wrap:wrap;gap:6px;max-height:340px;overflow:auto;margin-top:8px}
.big{font:700 44px/1 Caveat,cursive;color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:grid;gap:4px;border-top:6px solid var(--l)}
.rc h2{font-size:26px}
.meta{font-size:13px;color:var(--mut)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td,th{padding:8px 6px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:600}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.done td{opacity:.45;text-decoration:line-through}
.nm{font:600 21px/1.1 Caveat,cursive}
.empty{padding:28px;text-align:center;color:var(--mut);border:1.5px dashed var(--line);border-radius:16px}
.ov{position:fixed;inset:0;background:rgba(30,40,28,.45);display:grid;place-items:center;padding:16px;z-index:9}
.dlg{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border-radius:22px;padding:20px;width:min(680px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>label{display:grid;gap:3px;font-size:13px;color:var(--mut);flex:1 1 140px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 78px 104px 36px;gap:6px;margin-bottom:6px}
.ing button{padding:0}
.grp{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:6px;margin:10px 0 6px}
.grp input{font-weight:700;background:color-mix(in srgb,var(--b) 25%,var(--card))}
.grp button{padding:0}
.chip{flex-wrap:wrap}
.chip img{flex-basis:100%;width:100%;height:52px;object-fit:cover;border-radius:5px}
.rc img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-bottom:4px}
.hero{width:100%;max-height:260px;object-fit:cover;border-radius:16px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px}
.cat{margin:18px 0 8px}.cat small{font:600 13px Nunito,sans-serif;color:var(--mut)}
.tag{background:color-mix(in srgb,var(--l) 35%,var(--card));border-radius:999px;padding:1px 10px;color:var(--ink);font-weight:600}
h3{margin:12px 0 0;font:700 22px/1.1 Caveat,cursive;color:var(--acc)}
.imp{background:color-mix(in srgb,var(--l) 22%,var(--card));border-radius:16px;padding:12px;display:grid;gap:8px}
.st{font-size:14px;color:var(--mut)}.st.err{color:var(--warn)}
ol{padding-left:20px;margin:0}
@media(max-width:600px){.tabs{padding:6px 8px}.tab{padding:4px 6px}.logo{display:none}.date b{font-size:36px}.ing{grid-template-columns:minmax(0,1fr) 64px 88px 32px}}
@media(prefers-reduced-motion:no-preference){.slot,.chip{transition:background .15s}}
</style>

<div class="top">
  <nav class="tabs" role="tablist">
    <span class="logo">M</span>
    <button class="tab" data-t="plan" role="tab">Планер</button>
    <button class="tab" data-t="recipes" role="tab">Рецепты</button>
    <button class="tab" data-t="shop" role="tab">Покупки</button>
    <button class="tab" data-t="prices" role="tab">Цены</button>
    <button class="tab" data-t="settings" role="tab" id="tset">Настройки</button>
  </nav>
  <div>
    <div class="date"><b id="mon"></b><span id="dnum"></span></div>
    <div class="wk" id="wk"></div>
  </div>
</div>
<main class="paper" id="view"></main>
<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const NATIVE=window.webkit?.messageHandlers?.native; // set only inside the iPhone app
const PWA=window.__PWA__,LOCAL=NATIVE||PWA; // LOCAL: runs outside Claude, keys in Settings
const nat=m=>NATIVE.postMessage(m);
const http=(url,o={})=>nat({op:'http',url,method:o.method||'GET',headers:o.headers||{},body:o.body??null});
const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
const UNITS=['г','кг','мл','л','шт','ст.л.','ч.л.','щепотка','по вкусу'];
const CATS=['Выпечка','Салат','Суп','Жаркое','Горячее','Гарнир','Завтрак','Закуска','Десерт','Соус','Напиток','Другое'];
const groups=ings=>ings.reduce((a,i)=>{const g=i.g||'';(a.at(-1)?.[0]===g?a.at(-1)[1]:(a.push([g,[]]),a.at(-1)[1])).push(i);return a},[]);
const MEALS=[['b','Завтрак','var(--b)'],['l','Обед','var(--l)'],['d','Ужин','var(--d)']];
const CUR=['₫','₽','$','€','₸','₴','₾','£','₺','zł','Br','сум','֏','AED'];
const BASE={'г':['g',1],'кг':['g',1000],'мл':['ml',1],'л':['ml',1000],'шт':['pcs',1]};
const PER={g:'кг',ml:'л',pcs:'шт'};
const MON=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
let S={recipes:[],plan:{},prices:{},currency:'₫',checked:{}};
const ui={edit:false,tab:'plan',mode:'week',anchor:new Date(),q:''};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=addDays(d,-((d.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const num=v=>parseFloat(String(v??'').replace(',','.'));
const money=v=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(v)+' '+S.currency;
const recipe=id=>S.recipes.find(r=>r.id===id);

function range(){
  const a=ui.anchor;let s,e;
  if(ui.mode==='month'){s=monday(new Date(a.getFullYear(),a.getMonth(),1));e=addDays(monday(new Date(a.getFullYear(),a.getMonth()+1,0)),6)}
  else{s=monday(a);e=addDays(s,ui.mode==='2w'?13:6)}
  const out=[];for(let d=s;d<=e;d=addDays(d,1))out.push(d);return out;
}
// One product under different wording ("масло растопленное", "Яйца", "Сахар (я беру 100 г)") = one line in shopping and prices.
const SYN={'масло':'сливочное масло','масло сливочное':'сливочное масло','белый сахар':'сахар','сахар белый':'сахар','сахар-песок':'сахар','мука пшеничная':'мука','пшеничная мука':'мука',
  'сливки 33%':'сливки','сливки от 30%':'сливки','сливки 30%':'сливки','сливки 35%':'сливки','минеральная вода jaminca':'минеральная вода Jamnica','пищевая сода':'сода','сгущенное молоко':'сгущенка',
  'яйца':'яйцо','яйцо куриное':'яйцо','яйца куриные':'яйцо','желтки':'желток','белки':'белок','лимоны':'лимон','лаймы':'лайм','апельсины':'апельсин','яблоки':'яблоко','бананы':'банан',
  'помидоры':'помидор','томаты':'помидор','огурцы':'огурец','луковица':'лук','луковицы':'лук','лук репчатый':'лук','репчатый лук':'лук','морковка':'морковь','картошка':'картофель',
  'зубчик чеснока':'чеснок','зубчики чеснока':'чеснок','креветки':'креветка','грибы':'шампиньоны','орехи грецкие':'грецкие орехи'};
function prod(n){const raw=String(n||'').trim();
  const s=raw.replace(/\(.*?\)/g,' ').split(',')[0].replace(/комнатной температуры/gi,' ').split(/\s+/)
    .filter(w=>w&&!/^(растоплен|т[её]пл|горяч|холодн|размягч|мягк|охлажд|свеж)/i.test(w)).join(' ')||raw;
  return SYN[s.toLowerCase().replace(/ё/g,'е')]||s}
const pkey=n=>prod(n).toLowerCase().replace(/ё/g,'е'),pname=n=>{const s=prod(n);return s.charAt(0).toUpperCase()+s.slice(1)};
// merges price entries saved under old spellings into the product key
function normPrices(){let ch=0;for(const [k,p] of Object.entries(S.prices||{})){const nk=pkey(p.name||k);if(nk===k)continue;
  if(!(S.prices[nk]?.price>0))S.prices[nk]={...p,name:pname(p.name||k)};delete S.prices[k];ch=1}return ch}
function shopping(days,st=S){
  const m={};
  for(const d of days){const p=st.plan[iso(d)];if(!p)continue;
    for(const [k] of MEALS)for(const rid of p[k]||[]){const r=st.recipes.find(x=>x.id===rid);if(!r)continue;
      for(const i of r.ingredients){if(!(i.name||'').trim())continue;const name=pname(i.name);
        const [b,f]=BASE[i.unit]||[i.unit||'',1];const key=pkey(i.name)+'|'+b;const q=num(i.qty);
        m[key]??={key,name,b,qty:0,from:new Set()};if(!isNaN(q))m[key].qty+=q*f;m[key].from.add(r.name)}}}
  // one row per product; different units ("г", "ст. л.", "по вкусу") are listed together
  const g={};for(const v of Object.values(m)){const k=v.key.split('|')[0],c=cost(v,st);
    const r=g[k]??={key:k,name:v.name,parts:[],from:new Set(),cost:null};r.parts.push(v);v.from.forEach(x=>r.from.add(x));if(c!=null)r.cost=(r.cost||0)+c}
  for(const r of Object.values(g))r.q=[...new Set(r.parts.map(fmtQty))].join(' + ');
  return Object.values(g).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}
function cost(v,st=S){const p=st.prices[pkey(v.name)];if(!p||!(p.price>0)||PER[v.b]!==p.per||!v.qty)return null;return v.b==='pcs'?v.qty*p.price:v.qty/1000*p.price}
function fmtQty(v){const r=x=>+x.toFixed(2);
  if(v.b==='g')return v.qty>=1000?r(v.qty/1000)+' кг':Math.round(v.qty)+' г';
  if(v.b==='ml')return v.qty>=1000?r(v.qty/1000)+' л':Math.round(v.qty)+' мл';
  if(v.b==='pcs')return r(v.qty)+' шт';
  return (v.qty?r(v.qty)+' ':'')+v.b}

// self-check of the shopping maths
{const t={recipes:[{id:'a',name:'A',ingredients:[{name:'Мука',qty:'500',unit:'г'},{name:'мука',qty:'1,5',unit:'кг'},{name:'Яйца',qty:2,unit:'шт'},{name:'Сливочное масло растопленное',qty:50,unit:'г'},{name:'Масло (комнатной температуры)',qty:100,unit:'г'}]}],plan:{'2026-01-05':{b:['a'],d:['a']}},prices:{'мука':{price:100,per:'кг'}}};
 console.assert(groups([{g:'Тесто'},{g:'Тесто'},{}]).length===2,'groups self-check failed');
 const l=shopping([new Date(2026,0,5)],t);console.assert(l.length===3&&l[0].q==='4 кг'&&l[0].cost===400&&l[1].name==='Сливочное масло'&&l[1].q==='300 г'&&l[2].name==='Яйцо'&&l[2].q==='4 шт','shopping self-check failed',l)}

let db=null,tSave;
const setSaved=t=>{const e=$('#sv');if(e)e.textContent=t};
let savedMsg='';
function save(){
  try{localStorage.setItem('cooking-planner',JSON.stringify(S))}catch(e){if(PWA){savedMsg='Не сохранилось: память заполнена, удалите лишние картинки';return setSaved(savedMsg)}}
  clearTimeout(tSave);savedMsg='Сохраняю…';setSaved(savedMsg);
  tSave=setTimeout(async()=>{
    if(NATIVE){try{await nat({op:'save',json:JSON.stringify(S)});savedMsg='Сохранено на телефоне'}catch(e){savedMsg='Не удалось сохранить: '+e.message}return setSaved(savedMsg)}
    if(!db){savedMsg=PWA?'Сохранено на этом телефоне':'Сохранено в этом браузере';return setSaved(savedMsg)}
    try{await db.doc('planner/state').set({json:JSON.stringify(S),at:new Date().toISOString()});savedMsg='Сохранено'}
    catch(e){savedMsg='Не удалось сохранить ('+(e.code||'ошибка')+'), копия в браузере'}
    setSaved(savedMsg)},700);
}

function header(){
  const t=new Date();$('#mon').textContent=MON[t.getMonth()]+' /';$('#dnum').textContent=String(t.getDate()).padStart(2,'0');
  const a=ui.anchor,first=monday(new Date(a.getFullYear(),a.getMonth(),1)),last=new Date(a.getFullYear(),a.getMonth()+1,0);
  let h='',i=1;for(let w=first;w<=last;w=addDays(w,7),i++){const on=ui.mode==='week'&&iso(monday(a))===iso(w);h+=`<button data-w="${iso(w)}" class="${on?'on':''}" title="Неделя с ${w.getDate()} ${MON[w.getMonth()].toLowerCase()}">Н${i}</button>`}
  $('#wk').innerHTML=h;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===ui.tab));
}
function periodBar(){
  const d=range(),a=d[0],b=d[d.length-1];
  const lbl=ui.mode==='month'?MON[ui.anchor.getMonth()]+' '+ui.anchor.getFullYear():`${a.getDate()} ${MON[a.getMonth()].toLowerCase()} – ${b.getDate()} ${MON[b.getMonth()].toLowerCase()}`;
  return `<div class="bar"><button data-nav="-1" aria-label="Назад">‹</button><h2>${lbl}</h2><button data-nav="1" aria-label="Вперёд">›</button><button data-nav="0">Сегодня</button><span class="grow"></span>
  <div class="seg">${[['week','Неделя'],['2w','2 недели'],['month','Месяц']].map(([k,l])=>`<button data-mode="${k}" class="${ui.mode===k?'on':''}">${l}</button>`).join('')}</div></div>`;
}

const NOTION_PARENT='4230afcb36d881779195dd7b9797172c'; // page "Рецепты из кулинарного планера" in momo's Notion
const mdOf=r=>[[r.cat,r.time&&r.time+' мин',r.servings&&r.servings+' порц.'].filter(Boolean).join(' · '),'## Ингредиенты',
  ...groups(r.ingredients).flatMap(([g,is])=>[g?'### '+g:'',...is.map(i=>`- ${i.name} — ${i.qty?i.qty+' ':''}${i.unit}`)]),

  return {object:'block',type,[type]:{rich_text:[{type:'text',text:{content:text.slice(0,1900)}}]}}});
async function toNotion(btn){if(PWA){const st=$('#nst');try{await navigator.clipboard.writeText(S.recipes.map(r=>'# '+r.name+'\n'+mdOf(r)).join('\n\n---\n\n'));st.textContent='Скопировано. Вставь на страницу в Notion.'}catch{st.textContent='Не удалось скопировать'}return}
  const rs=S.recipes.filter(r=>!r.notion),st=$('#nst');if(!rs.length)return;btn.disabled=true;st.classList.remove('err');
  const T=S.settings||{},page=NATIVE?(String(T.notionPage||'').replace(/-/g,'').match(/[0-9a-f]{32}/i)||[])[0]:NOTION_PARENT;
  try{if(NATIVE&&!(T.notionToken&&page))throw{code:'укажите токен и страницу Notion в «Настройках»'};
    const mcp=NATIVE?null:await use('mcp');if(!NATIVE&&!mcp)throw{code:'Notion здесь недоступен'};
    for(const [k,r] of rs.entries()){st.textContent=`Выгружаю ${k+1} из ${rs.length}…`;
      if(NATIVE){const res=await http('https://api.notion.com/v1/pages',{method:'POST',headers:{Authorization:'Bearer '+T.notionToken,'Notion-Version':'2022-06-28','content-type':'application/json'},
        body:JSON.stringify({parent:{page_id:page},properties:{title:{title:[{text:{content:r.name}}]}},children:blocksOf(r)})});
        const b=JSON.parse(res.body);if(res.status!==200)throw{code:b.message||res.status};r.notion=b.url||'yes';save();continue}
      const res=await mcp.callTool('Notion','notion-create-pages',{parent:{type:'page_id',page_id:NOTION_PARENT},allow_async:false,pages:[{properties:{title:r.name},content:mdOf(r)}]});
      r.notion=res.payload?.pages?.[0]?.url||'yes';save()}
    render();$('#nst').innerHTML=`Готово. <a href="https://www.notion.so/${page}" target="_blank" rel="noopener">Открыть в Notion</a>`}
  catch(e){render();const n=$('#nst');n.textContent='Не получилось ('+(e.code||e.message||'ошибка')+')';n.classList.add('err')}}

    const mcp=await use('mcp');if(!mcp)throw{code:'Notion здесь недоступен'};btn.disabled=true;st.textContent='Сохраняю…';
    // shortcut: whole state in one code block; fine for text recipes, split it if backups grow past Notion limits.
    const res=await mcp.callTool('Notion','notion-create-pages',{parent:{type:'page_id',page_id:NOTION_PARENT},allow_async:false,pages:[{properties:{title:'Резервная копия планера '+new Date().toLocaleString('ru')},content:'```json\n'+backupJSON()+'\n```'}]});

  catch(e){st.classList.add('err');st.textContent='Не получилось ('+(e.code||e.message||'ошибка')+')'}finally{btn.disabled=false}}

Правила: всё на русском (переведи при необходимости). category строго одно из: ${CATS.join(', ')}. group — раздел ингредиента, если в рецепте они делятся (например "Тесто", "Опара", "Начинка", "Соус", "Крем"), иначе null; ингредиенты одного раздела идут подряд. name ингредиента короткий, в именительном падеже, без количества (например "куриное филе"). unit строго одно из: ${UNITS.join(', ')}. Переводи меры: cup→мл (240), oz→г (28), lb→г (454), tbsp→ст.л., tsp→ч.л., зубчик/пучок/банка→шт. Шаги короткие. Если рецепта в источнике нет, верни {"error":"причина"}.

const API='https://api.anthropic.com/v1/messages';
async function claudeDirect(prompt,url,imgs=[]){const key=S.settings?.claudeKey;if(!key)throw{msg:'Добавьте ключ Claude API во вкладке «Настройки» или заполните рецепт вручную.'};
  const headers={'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'};
  const b64=await Promise.all(imgs.map(b=>new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result.split(',')[1]);fr.onerror=no;fr.readAsDataURL(b)})));
  const text=prompt+(url?`\n\nОткрой страницу инструментом web_fetch и возьми рецепт оттуда (для YouTube — из названия и описания): ${url}`:'');
  const messages=[{role:'user',content:b64.length?[...b64.map(data=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data}})),{type:'text',text}]:text}];
  for(let i=0;i<4;i++){
    const body=JSON.stringify({model:'claude-opus-5-5',max_tokens:16000,output_config:{effort:'low'},fallbacks:'default',messages,...(url?{tools:[{type:'web_fetch_20260209',name:'web_fetch',max_uses:2,max_content_tokens:30000}]}:{})});
    const r=NATIVE?await http(API,{method:'POST',headers,body}):await fetch(API,{method:'POST',headers,body}).then(async x=>({status:x.status,body:await x.text()}));
    let t;try{t=JSON.parse(r.body)}catch{throw{msg:'Claude ответил странно ('+r.status+')'}}
    if(r.status!==200)throw{msg:'Claude: '+(t.error?.message||r.status)};
    if(t.stop_reason==='pause_turn'){messages.push({role:'assistant',content:t.content});continue}
    if(t.stop_reason==='refusal')throw{msg:'Claude не стал разбирать этот текст'};
    const x=t.content.filter(c=>c.type==='text').map(c=>c.text).join('');return JSON.parse(x.slice(x.indexOf('{'),x.lastIndexOf('}')+1))}
  throw{msg:'Claude не успел разобрать страницу, попробуйте ещё раз'}}
async function doImport(){
  const url=$('#iurl').value.trim(),txt=$('#itxt').value.trim(),st=$('#ist'),btn=$('#ibtn');
  const say=(t,err)=>{st.textContent=t;st.classList.toggle('err',!!err)};
  const photos=[...($('#iphoto')?.files||[])];
  if(!url&&!txt&&!photos.length)return say('Вставьте ссылку, текст или фото рецепта',1);
  btn.disabled=true;
  try{
    let src=txt;
    if(url){
      if(!/^https?:\/\//.test(url))throw{msg:'Ссылка должна начинаться с https://'};
      if(LOCAL){}
      else{const mcp=await use('mcp');
      if(mcp){say('Открываю страницу…');
        try{const r=await mcp.callTool('Firecrawl','firecrawl_scrape',{url,formats:['markdown'],onlyMainContent:true,objective:'Extract a cooking recipe (ingredients with amounts, steps) from this page'});
          src=(typeof r.payload==='string'?r.payload:JSON.stringify(r.payload??r.content)).slice(0,40000)+(txt?'\n\n'+txt:'')}
        catch(e){if(!txt)throw{msg:'Не удалось открыть ссылку ('+(e.code||'ошибка')+'). Вставьте текст рецепта в поле выше.'}}
      }else if(!txt)throw{msg:'Чтение ссылок здесь недоступно. Вставьте текст рецепта в поле выше.'};}
    }
    const sample=LOCAL?null:await use('sample');if(!LOCAL&&!sample)throw{msg:'Разбор через Claude здесь недоступен. Заполните рецепт вручную.'};
    say('Claude разбирает рецепт… (до минуты)');
    const imgs=await Promise.all(photos.map(f=>resize(f,1600)));
    if(imgs.length&&!LOCAL&&!(await sample.limits?.())?.images)throw{msg:'Разбор фото здесь недоступен. Вставьте текст рецепта.'};
    const P=PROMPT+(imgs.length?'(рецепт на приложенных фото; распознай текст)\n':'')+src;
    const j=LOCAL?await claudeDirect(P,url,imgs):await sample.json(P,imgs.length?{images:imgs}:undefined);
    if(!j||j.error)throw{msg:'Рецепт не найден: '+(j?.error||'пустой ответ')+'. Для видео вставьте описание или расшифровку.'};
    fillForm(j,url);say('Готово, проверьте и сохраните');
  }catch(e){say(e.msg||('Не получилось: '+(e.code||e.message||'ошибка')),1)}
  btn.disabled=false;
}

  else if(d.nav){const n=+d.nav;ui.anchor=n===0?new Date():ui.mode==='month'?new Date(ui.anchor.getFullYear(),ui.anchor.getMonth()+n,1):addDays(ui.anchor,n*(ui.mode==='2w'?14:7));render()}

  else if(d.go){ui.tab=d.go;render()}

  else if(d.pick)pick(d.pick);
  else if(d.put){const [k,m,id]=d.put.split('|');slotArr(k,m).push(id);save();close();render()}

  else if(d.edit)editRecipe(d.edit);

  else if(d.bk!==undefined)backup(t);
  else if(d.rs!==undefined)restore(t);
  else if(d.editplan!==undefined){ui.edit=!ui.edit;if(!ui.edit)save();render()}
  else if(d.del){if(t.textContent!=='Точно удалить?'){t.textContent='Точно удалить?';return}
    S.recipes=S.recipes.filter(r=>r.id!==d.del);for(const p of Object.values(S.plan))for(const m in p)p[m]=p[m].filter(x=>x!==d.del);save();close();render()}
  else if(d.close!==undefined)close();
  else if(d.addi!==undefined)$('#ings').insertAdjacentHTML('beforeend',ingRow());
  else if(d.addg!==undefined){$('#ings').insertAdjacentHTML('beforeend',grpRow('')+ingRow());[...$('#ings').querySelectorAll('[data-g]')].at(-1).focus()}
  else if(d.rmi!==undefined)t.parentElement.remove();
  else if(d.uncheck!==undefined){S.checked={};save();render()}
  else if(d.open)showRecipe(d.open);
});

и после выпечки должны быть мягкими, не хрустящими."],"source":"https://www.youtube.com/watch?v=Jo8Cnm22mhA"},{"id":"3473da77cfc1456fa8c863409751076a","name":"Pina Colada","cat":"Напиток","img":"img/3473da77cfc1456fa8c863409751076a.jpg","servings":"","time":"","ingredients":[{"name":"Ром Havana Club","qty":40,"unit":"мл"},{"name":"Сироп Monin Coconut","qty":40,"unit":"мл"},{"name":"Сливки от 30%","qty":30,"unit":"мл"},{"name":"Ананасовый сок (до края стакана)","qty":"","unit":"по вкусу"},{"name":"Лёд","qty":"","unit":"по вкусу"}],"steps":["В большой стакан набрать лёд чуть выше половины.","Добавить ром, кокосовый сироп и сливки, долить ананасовый сок.","Накрыть шейкером и потрясти пару секунд."],"source":"https://www.notion.so/3473da77cfc1456fa8c863409751076a"},{"id":"3870afcb36d8801884bfdb23fa823d0b","name":"Чизкейк","cat":"Десерт","img":"img/3870afcb36d8801884bfdb23fa823d0b.jpg","servings":"","time":"","ingredients":[],"steps":[],"source":"https://www.notion.so/3870afcb36d8801884bfdb23fa823d0b"},{"id":"3870afcb36d880199fe2e5cdee12b7db","name":"Ананасовый тарт татен","cat":"Десерт","img":"img/3870afcb36d880199fe2e5cdee12b7db.jpg","servings":"","time":"","ingredients":[],"steps":[],"source":"https://www.notion.so/3870afcb36d880199fe2e5cdee12b7db"},{"id":"3870afcb36d8802381a9ea146652f0d4","name":"Сырники","cat":"Завтрак","img":"img/3870afcb36d8802381a9ea146652f0d4.jpg","servings":"","time":"","ingredients":[],"steps":[],"source":"https://www.notion.so/3870afcb36d8802381a9ea146652f0d4"},{"id":"3870afcb36d8802ca931d1c697a8d195","name":"Морковный торт","cat":"Десерт","img":"img/3870afcb36d8802ca931d1c697a8d195.jpg","servings":"","time":"","ingredients":[],"steps":[],"source":"https://www.notion.so/3870afcb36d8802ca931d1c697a8d195"},{"id":"3870afcb36d8803b825bc79365f35c5d","name":"Творог","cat":"Другое","img":"img/3870afcb36d8803b825bc79365f35c5d.jpg","servings":"","time":"","ingredients":[{"name":"Молоко (на 400 г творога), комнатной температуры","qty":2,"unit":"л"},{"name":"Кефир или несладкий йогурт, комнатной температуры","qty":250,"unit":"г"},{"name":"Соль","qty":"","unit":"по вкусу"}],"steps":["День 1, лучше вечером: влить молоко в кастрюлю с толстым дном, добавить кефир и перемешать.","Нагреть на очень медленном огне (800 Вт). Не мешать! Закрыть крышкой. Чтобы не пригорало, можно поставить на водяную баню, 1 час при 1000 Вт.","Догреть, чтобы молоко начало пениться и жидкость расслоилась.","День 2, утром: открыть крышку (иначе от давления её сорвёт) и снова медленно нагреть до начала кипения. Не кипятить!","Остудить, слить сыворотку, творог переложить в марлю и подвесить, чтобы стекло. При необходимости отжать руками, посолить по вкусу.","Иногда сутки ждать не нужно: творог может быть готов через час. Чем выше температура, тем жёстче и суше творог."],"source":"https://www.notion.so/3870afcb36d8803b825bc79365f35c5d"},{"id":"3870afcb36d88049aa9cf0f231d3c76a","name":"Ватрушки","cat":"Выпечка","img":"img/3870afcb36d88049aa9cf0f231d3c76a.jpg","servings":"","time":"","ingredients":[],"steps":[],"source":"https://www.notion.so/3870afcb36d88049aa9cf0f231d3c76a"},{"id":"3870afcb36d8805c86e9f46fca4ee621","name":"Пицца","cat":"Горячее","img":"img/3870afcb36d8805c86e9f46fca4ee621.jpg","servings":"","time":"","ingredients":[],"steps":[],"source":"https://www.notion.so/3870afcb36d8805c86e9f46fca4ee621"},{"id":"3870afcb36d88065a51be3dad15e2bd4","name":"Пирожное «Картошка»","cat":"Десерт","img":"img/3870afcb36d88065a51be3dad15e2bd4.jpg","servings":"","time":"","ingredients":[],"steps":[],"source":"https://www.notion.so/3870afcb36d88065a51be3dad15e2bd4"},{"id":"3870afcb36d8808183a7d2c374f6083d","name":"Блины","cat":"Завтрак","img":"img/3870afcb36d8808183a7d2c374f6083d.jpg","servings":"","time":"","ingredients":[],"steps":[],"source":"https://www.notion.so/3870afcb36d8808183a7d2c374f6083d"},{"id":"3870afcb36d8808eb67dfc0f87eec054","name":"Творожная галета с ягодами","cat":"Выпечка","img":"img/3870afcb36d8808eb67dfc0f87eec054.jpg","servings":"" co, Aperol и Jamnica.","Добавить дольки апельсина, можно дожать немного сока."],"source":"https://www.notion.so/5c1463b01bf24071b3c46cda51354d4e"},{"id":"d746a9b4c5a641e6b5779a9c479f651f","name":"Cuba Libre","cat":"Напиток","img":"img/d746a9b4c5a641e6b5779a9c479f651f.jpg","servings":"","time":"","ingredients":[{"name":"Лайм","qty":0.5,"unit":"шт"},{"name":"Ром Havana Club","qty":30,"unit":"мл"},{"name":"Coca-Cola","qty":125,"unit":"мл"},{"name":"Сироп Monin Lime","qty":"","unit":"по вкусу"},{"name":"Лёд","qty":"","unit":"по вкусу"}],"steps":["Разрезать половину лайма на 4 крупные части и выжать сок в стакан.","Добавить лёд до краёв.","Влить ром и колу, добавить чуть-чуть сиропа лайма."],"source":"https://www.notion.so/d746a9b4c5a641e6b5779a9c479f651f"},{"id":"fb079cd44372473f9d42c19e7fd2e782","name":"Hugo","cat":"Напиток","img":"img/fb079cd44372473f9d42c19e7fd2e782.jpg","servings":"","time":"","ingredients":[{"name":"Сироп бузины","qty":40,"unit":"мл"},{"name":"Prosecco","qty":100,"unit":"мл"},{"name":"Минеральная вода Jamnica","qty":100,"unit":"мл"},{"name":"Лайм","qty":"","unit":"по вкусу"},{"name":"Мята","qty":"","unit":"по вкусу"},{"name":"Лёд","qty":"","unit":"по вкусу"}],"steps":["Наполнить стакан льдом.","Добавить сироп, Prosecco и Jamnica.","Украсить 4 дольками лайма и мятой."],"source":"https://www.notion.so/fb079cd44372473f9d42c19e7fd2e782"},{"id":"chat-ris-varenyi","name":"Рис","cat":"Гарнир","img":"","servings":"","time":15,"ingredients":[{"name":"Рис","qty":"","unit":"по вкусу"},{"name":"Вода (на подушечку пальца выше риса)","qty":"","unit":"по вкусу"}],"steps":["Залить рис водой так, чтобы вода была выше риса на подушечку пальца.","Варить 15 минут на плите мощностью 400 Вт."],"source":""}];
// Adds Notion recipes once; S.seeded remembers them so a recipe the user deletes does not come back.
function seed(){const done=new Set(S.seeded||[]);let n=0;
  for(const r of SEED){const x=recipe(r.id);
    // a recipe filled in later fills a still-empty copy the user already has
    if(x){if(!x.ingredients.length&&!x.steps.length&&r.ingredients.length){Object.assign(x,{ingredients:structuredClone(r.ingredients),steps:[...r.steps],time:x.time||r.time});n++}}
    else if(!done.has(r.id)){S.recipes.push(structuredClone(r));n++}
    done.add(r.id)}
  S.seeded=[...done];if(normPrices()|n)save();return n}
async function boot(){
  if(NATIVE){if(window.__STATE__)S={...S,...window.__STATE__};seed();render();savedMsg='Данные хранятся на телефоне';return setSaved(savedMsg)}
  try{const l=localStorage.getItem('cooking-planner');if(l)S={...S,...JSON.parse(l)}}catch{}

  render();
  db=await use('db');

  try{const s=await db.doc('planner/state').get();if(s.exists)S={...S,...JSON.parse(s.data().json)};seed();savedMsg='Синхронизировано';render()}
  catch(e){savedMsg='Хранилище недоступно, работаю с копией в браузере';setSaved(savedMsg)}
}
boot();
}
